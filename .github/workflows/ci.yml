name: Iris ML API-CI pipeline - CSE

# Run the workflow on pushes and pull requests targeting main
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Restrict permissions to reading repository contents
permissions:
  contents: read

jobs:
  test-and-build:
    # GitHub provides a fresh Ubuntu runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code
      - name: Check out repository
        uses: actions/checkout@v7

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Step 3: Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run automated tests
      - name: Run automated tests
        run: python -m pytest -v

      # Step 5: Build Docker image
      - name: Build Docker image
        run: docker build -t iris-ml-api:${{ github.sha }} .